// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Health Connect's client library (androidx.health.connect:connect-client)
        // is Kotlin-first, so the app module needs Kotlin support again. 2.0.21 is
        // the current stable release and is compatible with AGP 8.13.0 / compileSdk
        // 36 — kept as a literal here (matching the two classpath entries above)
        // since `variables.gradle` isn't applied until after this block runs; the
        // *same* version is exposed as `kotlinVersion` in variables.gradle for
        // app/build.gradle's own Kotlin dependencies.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
